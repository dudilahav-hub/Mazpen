<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2B5A85">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>מצפן EMDR</title>
<style>
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: tablet-first session console. Script to read aloud dominates; client context in a side rail; stop button always reachable. */
:root{
  --bg:#EAEEF1; --panel:#FFFFFF; --sunk:#F4F6F8; --ink:#16212C; --muted:#5A6977; --line:#D2DAE1;
  --accent:#2B5A85; --accent-ink:#FFFFFF; --accent-soft:#DCE7F1;
  --word:#FAE9BF; --word-ink:#553800;
  --stop:#AE4327; --stop-ink:#FFFFFF;
  --ok:#2C7350; --ok-soft:#DBEEE3; --warn:#93600E; --warn-soft:#F6EAD1; --idle:#6B7884; --idle-soft:#E6EBEF;
  --f-script:"Noto Serif Hebrew","Frank Ruhl Libre","David",Georgia,serif;
  --f-ui:"Noto Sans Hebrew","Assistant","Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161C; --panel:#18212A; --sunk:#141B22; --ink:#E5EBF0; --muted:#95A4B1; --line:#2A3742;
  --accent:#86B3DE; --accent-ink:#0D1620; --accent-soft:#1E3247;
  --word:#4A3911; --word-ink:#FBE2A3;
  --stop:#E0785A; --stop-ink:#1A0D08;
  --ok:#6CC49A; --ok-soft:#163126; --warn:#E3B15B; --warn-soft:#382B13; --idle:#9AA7B2; --idle-soft:#222D37;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C; --panel:#18212A; --sunk:#141B22; --ink:#E5EBF0; --muted:#95A4B1; --line:#2A3742;
  --accent:#86B3DE; --accent-ink:#0D1620; --accent-soft:#1E3247;
  --word:#4A3911; --word-ink:#FBE2A3;
  --stop:#E0785A; --stop-ink:#1A0D08;
  --ok:#6CC49A; --ok-soft:#163126; --warn:#E3B15B; --warn-soft:#382B13; --idle:#9AA7B2; --idle-soft:#222D37;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:17px;line-height:1.5;margin:0}
#app{padding-inline:16px;padding-block:0 40px;max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{font-weight:800;letter-spacing:.01em;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.brand .mark{display:inline-flex;gap:3px}
.brand .mark i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.brand .mark i:last-child{opacity:.45}
.tag{font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.spacer{flex:1}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600}
.ghost:hover{background:var(--panel)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg-label{font-size:.8rem;color:var(--muted)}
.stopbtn{background:var(--stop);color:var(--stop-ink);border:0;border-radius:10px;padding:9px 18px;font-weight:800;letter-spacing:.02em}
.timeout{background:transparent;border:1px solid var(--stop);color:var(--stop);border-radius:10px;padding:8px 12px;font-weight:700}

/* phase pills */
.phases{display:flex;flex-wrap:wrap;gap:6px}
.ph{font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--idle-soft);color:var(--idle)}
.ph.on{background:var(--accent);color:var(--accent-ink)}
.ph.done{background:var(--accent-soft);color:var(--accent)}

/* home */
.client{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px;margin-bottom:22px}
.client h1{font-family:var(--f-script);font-weight:700;font-size:2.4rem;line-height:1.1}
.client .meta{color:var(--muted);font-size:.95rem}
.client .meta b{color:var(--ink);font-weight:600}
.modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:28px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mod .pn{font-family:var(--f-script);font-size:2rem;line-height:1;color:var(--accent);font-weight:700}
.mod h3{font-size:1.1rem}
.mod p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:700;align-self:flex-start}
.primary:disabled{opacity:.4;cursor:not-allowed}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;margin-bottom:28px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.sec-h{font-size:.8rem;font-weight:800;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.triad{display:grid;gap:14px}
.triad h4{margin:0 0 6px;font-size:.95rem}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{flex:1;min-width:0}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-prog{background:var(--warn-soft);color:var(--warn)}
.st-wait{background:var(--idle-soft);color:var(--idle)}
.st-next{background:var(--accent-soft);color:var(--accent)}
.star{color:var(--warn);font-size:.8rem;font-weight:700}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.res{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res .k{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.res .cue{font-family:var(--f-script);font-size:1.25rem}
.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:760px}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.06em;color:var(--muted);font-weight:800;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.foot{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}

/* run */
.run{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
@media (max-width:900px){.run{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px 26px;min-width:0}
.eyebrow{font-size:.8rem;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-bottom:6px}
.stage h2{font-size:1.35rem;margin-bottom:14px}
.script{font-family:var(--f-script);font-size:clamp(1.3rem,1.1rem + 1vw,1.75rem);line-height:1.65;margin:0 0 14px;white-space:pre-line}
.w{background:var(--word);color:var(--word-ink);border-radius:5px;padding:0 5px;font-weight:500;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.w.e{opacity:.6}
.note{font-size:.92rem;color:var(--muted);border-inline-start:3px solid var(--line);padding-inline-start:10px;margin:0 0 16px;white-space:pre-line}
.advice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0 0 16px;font-size:.95rem}
.advice b{display:block;font-size:.75rem;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.advice.warn{background:var(--warn-soft)}
.advice.warn b{color:var(--warn)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:right;min-height:56px;padding:12px 16px;border-radius:11px;border:1.5px solid var(--line);background:var(--sunk);font-weight:600;font-size:1.02rem}
.opt:hover{border-color:var(--accent)}
.opt.rec{border-color:var(--accent);background:var(--accent-soft)}
.opt .badge{font-size:.72rem;font-weight:800;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 9px;white-space:nowrap}
.field{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);color:var(--ink)}
textarea.field{min-height:110px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.scale{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:8px;direction:ltr}
.scale button{min-height:60px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.scale button:hover{border-color:var(--accent)}
.scale-ends{display:flex;justify-content:space-between;direction:ltr;font-size:.82rem;color:var(--muted);margin-top:6px}
.nccat{margin-bottom:12px}
.nccat h4{margin:0 0 6px;font-size:.82rem;letter-spacing:.05em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pcs{font-size:.92rem;color:var(--muted);margin-top:4px}
.litem{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.litem .tx{flex:1;min-width:160px}
.litem .age{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.tog{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;color:var(--muted)}
.tog[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:2px 8px}
.ladd{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;margin-top:10px}
.ladd.noage{grid-template-columns:minmax(0,1fr) auto}

/* BLS pace guide */
.bls{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin:0 0 16px;display:grid;gap:8px}
.track{position:relative;height:18px;background:var(--sunk);border-radius:999px;direction:ltr}
.track::before,.track::after{content:"";position:absolute;top:4px;width:2px;height:10px;background:var(--line)}
.track::before{left:8px}.track::after{right:8px}
.dot{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
.dot.on{animation:sweep 1s ease-in-out infinite alternate}
.bls.slow .dot.on{animation-duration:2s}
@keyframes sweep{from{left:2px}to{left:calc(100% - 16px)}}
@media (prefers-reduced-motion:reduce){.dot.on{animation:none;left:calc(50% - 7px)}}
.blsmeta{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.88rem;color:var(--muted)}
.blsmeta b{color:var(--ink)}

/* context rail */
.ctx{display:grid;gap:12px;min-width:0}
.ctx .box{display:grid;gap:10px}
.kv .k{font-size:.74rem;font-weight:800;letter-spacing:.07em;color:var(--muted)}
.kv .v{font-size:.98rem;overflow-wrap:anywhere}
.kv .v.script-sm{font-family:var(--f-script);font-size:1.1rem}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meter{background:var(--sunk);border-radius:10px;padding:8px 10px}
.meter .k{font-size:.72rem;font-weight:800;letter-spacing:.07em;color:var(--muted)}
.meter .v{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.meter .v small{font-size:.85rem;color:var(--muted);font-weight:600}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;direction:ltr;margin-top:4px}
.spark i{flex:1;max-width:16px;background:var(--accent);opacity:.55;border-radius:3px 3px 0 0;min-height:2px}
.spark i:last-child{opacity:1}
.counters{font-size:.85rem;color:var(--muted)}

/* summary */
.sumhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.sumhead h1{font-family:var(--f-script);font-size:2rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;direction:ltr;padding-top:18px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;max-width:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b span{font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.bars .b i{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px}
.bars-cap{font-size:.8rem;color:var(--muted);margin-top:6px}

/* overlay */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.ovcard{background:var(--panel);border:2px solid var(--stop);border-radius:16px;max-width:720px;width:100%;padding:22px 24px;display:grid;gap:14px}
.ovcard h2{color:var(--stop)}

/* gate screens, client list, forms */
.gate{display:grid;justify-items:center;padding-block:8vh 40px}
.gatecard{width:100%;max-width:470px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;display:grid;gap:12px}
.gatecard h1{font-family:var(--f-script);font-size:1.9rem}
.gatecard p{margin:0;color:var(--muted)}
.gatecard .primary{align-self:stretch;justify-self:stretch;min-height:52px}
.gatecard .link{justify-self:start}
.lbl{display:block;font-size:.8rem;font-weight:800;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}
.ack{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.ack input{width:22px;height:22px;margin-top:2px;flex:none}
.danger{background:var(--stop);color:var(--stop-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ccard{display:grid;gap:6px;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.ccard:hover{border-color:var(--accent)}
.ccard .cn{font-family:var(--f-script);font-size:1.45rem;font-weight:700}
.ccard .cm{color:var(--muted);font-size:.92rem}
.advice .row{margin-top:10px}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="he"></div>
<div id="ov" dir="rtl" lang="he" hidden></div>
<script src="app.js"></script>
</body>
</html>
